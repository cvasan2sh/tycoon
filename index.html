<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Southeast Asian Trade Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a storybook map of the 1520 Indian Ocean fills the screen; chunky paper cards float on top like a mobile trading game. */
:root{
  --sea:#5bbfd0;
  --paper:#fff7e6;
  --paper2:#fdebc8;
  --edge:#c99a5b;
  --ink:#4a2f1d;
  --muted:#8a6c4f;
  --gold:#f5a623;
  --green:#5fb840;
  --red:#e2553f;
  --font:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#4aaac2;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2f7fbf;outline-offset:2px}
.app{position:relative;height:100%;display:grid;grid-template-columns:1fr 450px;grid-template-rows:1fr}
#mapwrap{position:relative;overflow:hidden;background:#6cc6d6;touch-action:none;cursor:grab;grid-row:1;grid-column:1/-1}
#mapwrap.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;display:block;transform-origin:0 0;overflow:visible;will-change:transform}
header.hud{position:absolute;top:10px;left:10px;right:470px;z-index:5;display:flex;gap:8px;flex-wrap:nowrap;align-items:stretch;pointer-events:none;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
header.hud::-webkit-scrollbar{display:none}
.pill,.brand,.hbtn{flex:none}
header.hud>*{pointer-events:auto}
.brand{background:var(--paper);border:3px solid var(--edge);border-radius:16px;padding:4px 14px;line-height:1;box-shadow:0 4px 0 #b0834b;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--muted);font-weight:600}
.brand b{font-size:21px;color:#c0521f;font-weight:800;letter-spacing:.3px}
.pill{background:var(--paper);border:3px solid var(--edge);border-radius:999px;padding:3px 14px 3px 6px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 #b0834b}
.pill div{display:flex;flex-direction:column;line-height:1.05}
.pill b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.pill span{font-size:11px;color:var(--muted);font-weight:600}
.bar{width:70px;height:7px;background:#ead6b0;border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--gold)}
.spacer{flex:1}
.hbtn{background:var(--paper);border:3px solid var(--edge);border-radius:14px;padding:4px 12px;cursor:pointer;font-weight:700;box-shadow:0 4px 0 #b0834b}
.hbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #b0834b}
.klabel{font-weight:800;letter-spacing:3px;text-anchor:middle;pointer-events:none;text-transform:uppercase;paint-order:stroke;stroke:#fff8e6;stroke-width:3px;stroke-opacity:.6;transition:opacity .3s}
.city{cursor:pointer}
.city .clabel{font-size:13px;font-weight:800;fill:#4a2f1d;paint-order:stroke;stroke:#fffaf0;stroke-width:4px;stroke-linejoin:round}
.city .selring{fill:#fff3b0;stroke:#f5a623;stroke-width:3;opacity:0}
.city.sel .selring{opacity:1}
.city.here .clabel{fill:#c0521f}
.city.locked .cs>g{opacity:.5}

.route{fill:none;stroke:#7a4e2e;stroke-width:3.5;stroke-dasharray:2 9;stroke-linecap:round}
.route.sea{stroke:#fff;stroke-width:3.5}
#caravan{pointer-events:none;transition:transform .12s linear;will-change:transform}
#caravan.moving #carBob{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
#carTag{font-size:11px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#c0521f;stroke-width:4px;stroke-linejoin:round}
.mapctl{position:absolute;right:466px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:4}
.mapctl button{width:42px;height:42px;border-radius:14px;border:3px solid var(--edge);background:var(--paper);cursor:pointer;font-size:20px;font-weight:800;box-shadow:0 4px 0 #b0834b}
.legend{display:none!important;position:absolute;left:10px;bottom:14px;background:var(--paper);border:3px solid var(--edge);border-radius:16px;padding:8px 12px;font-size:13px;color:var(--muted);max-width:300px;box-shadow:0 4px 0 #b0834b;z-index:4}
.legend b{color:var(--ink)}
aside{grid-row:1;grid-column:2;margin:10px 10px 10px 0;background:var(--paper);border:3px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 #b0834b,0 12px 30px rgba(40,30,10,.25);display:flex;flex-direction:column;min-height:0;z-index:6;overflow:hidden}
.tabs{display:flex;gap:2px;padding:8px 6px 0;scrollbar-width:none;background:var(--paper2);border-bottom:3px solid var(--edge);overflow-x:auto}
.tabs button{flex:1 1 auto;background:transparent;border:0;border-radius:12px 12px 0 0;padding:7px 5px 6px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:800;font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--paper);color:#c0521f;box-shadow:0 -3px 0 var(--gold) inset}
#panel{container-type:inline-size;padding:14px 14px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
h2{font-weight:800;font-size:26px;margin:0;line-height:1.05;text-wrap:balance;color:#5b3a24}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:4px 0 -4px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.note{margin:0;font-size:14px;color:#6b4f35;background:var(--paper2);border-radius:12px;padding:6px 10px}
.cityhead{display:flex;gap:10px;align-items:center}
.kdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1.5px solid #5b3a24;vertical-align:-1px}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:1px 9px;border-radius:999px;border:2px solid #e4cfa6;background:#fff;color:var(--muted);font-weight:700;white-space:nowrap}
.chip.gold{color:#a8670a;border-color:var(--gold);background:#fff4d6}
.chip.red{color:var(--red);border-color:#f2b3a7;background:#fff0ec}
.chip.green{color:#3c8a24;border-color:#b5e09e;background:#f1fbe9}
.card{background:#fff;border:2.5px solid #ecd8b2;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.court{border-color:var(--gold);background:#fffaf0}
.card.lockcard{border-color:#f2b3a7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--gold);color:#fff;border:0;border-bottom:4px solid #c47d0e;border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{background:#d9cbb0;border-bottom-color:#b8a888;color:#fff;cursor:not-allowed;text-shadow:none}
.btn.go{background:var(--green);border-bottom-color:#3f8a28}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #e4cfa6;border-bottom:4px solid #e4cfa6;text-shadow:none;font-weight:700}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:10px}
.btn.big{font-size:18px;padding:8px 22px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#fff;border:2px solid #f0e0c2;border-radius:14px;padding:4px 8px;text-align:left}
.linkitem{cursor:pointer;width:100%}
.linkitem:hover{border-color:var(--gold)}
.good{display:flex;align-items:center;gap:8px;min-width:0}
.good>div{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.good b{font-weight:800;font-size:15px}
.good small{color:var(--muted);font-size:12px}
.gi{flex:none}
.price{text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.05}
.price small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.price.up{color:#3c8a24}.price.down{color:var(--red)}
.act{display:flex;gap:4px;align-items:center}
.qty{width:52px;background:#fffaf0;border:2px solid #e4cfa6;color:var(--ink);border-radius:10px;padding:2px 4px;font:inherit;text-align:right;font-weight:700}
select.qty{text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid #f0e0c2;border-radius:999px;padding:2px 10px 2px 4px;font-weight:700;font-size:13px}
.infbar{position:relative;height:20px;background:#f3e4c4;border-radius:999px;overflow:hidden;border:2px solid #e4cfa6}
.infbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f5c542,#f5a623)}
.infbar span{position:relative;font-size:12px;font-weight:800;padding-left:10px;line-height:16px}
.crewrow{border-bottom:2px dashed #f0e0c2;padding-bottom:6px}
.upgrade{background:#f4fbef;border-color:#b5e09e}
.log{font-size:14px;display:flex;flex-direction:column;gap:5px}
.log div{border-left:4px solid #ecd8b2;padding-left:8px;background:#fff;border-radius:6px}
.log .g{border-color:var(--green)} .log .r{border-color:var(--red)} .log .y{border-color:var(--gold)}
.toast{position:fixed;left:calc((100% - 450px)/2);bottom:24px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--gold);padding:8px 16px;border-radius:14px;z-index:50;max-width:90vw;font-size:15px;font-weight:700;box-shadow:0 4px 0 #c47d0e}
.modal-bg{position:fixed;inset:0;background:rgba(40,28,12,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--paper);border:4px solid var(--edge);border-radius:22px;max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;box-shadow:0 8px 0 #b0834b}
.modal h2{color:#c0521f}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .btn{text-align:left}
.statpills{display:flex;gap:6px;flex-wrap:wrap}
.statpills span{font-size:12px;background:var(--paper2);border-radius:8px;padding:1px 7px;font-weight:700;font-variant-numeric:tabular-nums}
.title-screen{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#a9e6ee,#4aaac2 75%);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.title-card{max-width:640px;display:flex;flex-direction:column;gap:12px;background:var(--paper);border:4px solid var(--edge);border-radius:28px;padding:22px 26px;box-shadow:0 8px 0 #b0834b}
.title-card .hero{width:100%;max-height:200px}
.kicker{letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;font-size:13px}
.title-card h1{font-weight:800;font-size:clamp(36px,7vw,58px);line-height:.95;margin:0;color:#c0521f;text-shadow:0 3px 0 #f5c542}
.title-card p{margin:0;font-size:17px;max-width:60ch}
.title-card input{background:#fff;border:3px solid #e4cfa6;color:var(--ink);border-radius:12px;padding:7px 10px;font:inherit;font-size:17px;font-weight:700;min-width:220px}
textarea{width:100%;min-height:90px;background:#fff;color:var(--ink);border:2px solid #e4cfa6;border-radius:10px;font:12px monospace;padding:6px}
details summary{cursor:pointer}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100%}
  #mapwrap{grid-column:1;grid-row:1}
  header.hud{right:10px}
  .brand{display:none}
  .pill{padding:2px 10px 2px 4px}.pill b{font-size:15px}
  aside{grid-column:1;grid-row:2;margin:0;border-radius:22px 22px 0 0}
  #panel{overflow:visible}
  .mapctl{right:10px}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.kdot.big{width:16px;height:16px;flex:none}
@container (max-width:380px){.item{grid-template-columns:1fr auto}.item .act{grid-column:1/-1;justify-content:flex-end}}
@media (max-width:1450px){.brand{display:none}}
@media (max-width:900px){
  header.hud{right:10px;top:8px;gap:6px}
  .pill span{display:none}.pill .bar{width:44px}
  .hbtn{padding:2px 10px;order:-1}
  .toast{left:50%;bottom:auto;top:64px}
  .tabs button{font-size:13px;padding:7px 8px 6px}
}

.panelclose{display:none}
@media (min-width:901px){
  .app{display:block}
  #mapwrap{position:absolute;inset:0}
  aside{position:absolute;top:10px;bottom:10px;right:88px;width:430px;margin:0;transform:translateX(calc(100% + 110px));transition:transform .22s ease;visibility:hidden}
  .app.panel-open aside{transform:none;visibility:visible}
  .tabs{display:none}
  .panelclose{display:flex;position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:12px;border:2px solid #e4cfa6;background:#fff;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;z-index:2;color:var(--ink)}
  #panel{padding-top:16px}
  .dock{position:absolute;right:10px;top:10px;width:70px;display:flex;flex-direction:column;gap:6px;z-index:7}
  .dockb{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--paper);border:3px solid var(--edge);border-radius:16px;padding:6px 2px 4px;cursor:pointer;box-shadow:0 4px 0 #b0834b;font-weight:800;font-size:11.5px;color:var(--muted)}
  .dockb.on{background:#fff4d6;border-color:var(--gold);color:#c0521f}
  .dockb:active{transform:translateY(2px);box-shadow:0 2px 0 #b0834b}
  header.hud{right:96px}
  .mapctl{right:96px;transition:right .22s ease}
  .app.panel-open .mapctl{right:530px}
  .toast{left:50%}
}
@media (max-width:900px){.dock{display:none}}

.city:focus{outline:none}.city:focus-visible .selring{opacity:1}
/* ===== Stage 1–3 ===== */
#mapwrap,#mapwrap *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#caravan,#caravan *{pointer-events:none}
.btn:disabled,.btn.go:disabled,.btn.big:disabled{background:#d9cbb0!important;border-color:#c9b48d!important;color:#8a7356!important;box-shadow:none!important;cursor:not-allowed;opacity:.85}
@media (min-width:901px){.app.panel-open header.hud{right:560px}}
/* odds & dice */
.result{font-weight:600}
.die{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;margin-right:8px;border-radius:9px;background:#fff;border:3px solid var(--edge);font-weight:800;font-size:16px;color:#c0521f;box-shadow:0 3px 0 #b0834b;animation:roll .7s cubic-bezier(.2,.8,.3,1.2);vertical-align:middle}
@keyframes roll{0%{transform:rotate(-540deg) scale(.3);opacity:0}70%{transform:rotate(20deg) scale(1.15);opacity:1}100%{transform:none}}
/* celebrations */
.modal{position:relative;overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(30px)}}
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.celebrate .cart{width:120px;height:110px;display:flex;align-items:center;justify-content:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.4)}
.celebrate .cart svg,.celebrate .cart img{width:100%;height:100%;object-fit:contain}
.celebrate .huge{font-size:clamp(26px,6vw,38px);font-weight:800;color:#c0521f;margin:2px 0;line-height:1.05;text-shadow:0 2px 0 #f5c542}
.celebrate .big{font-size:17px;margin:0}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
.coinfly{position:fixed;z-index:60;transform:translateX(-50%);font-weight:800;font-size:22px;color:#3f8f4a;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:fly 1.4s ease-out forwards}
.coinfly.down{color:#c0521f}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,40px) scale(1)}}
.pill.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.12)}}
/* goals strip */
.goals{position:absolute;left:10px;top:74px;z-index:4;display:flex;flex-direction:column;gap:6px;max-width:min(560px,calc(100% - 120px));pointer-events:none}
.goals>div{pointer-events:none;background:rgba(255,248,232,.95);border:3px solid var(--edge);border-radius:14px;padding:5px 10px;box-shadow:0 3px 0 #b0834b;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.goals small{color:#3f8f4a;font-weight:800}
.goals .sub2{font-size:12.5px;color:var(--muted)}
.gtag{background:#c0521f;color:#fff;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.gtag.t{background:#7a4e2e}
.gwarn{background:#ffe2d8!important;border-color:#e2553f!important;color:#8a2a17}
@media (min-width:901px){.app.panel-open .goals{max-width:calc(100% - 600px)}}
@media (max-width:900px){.goals{top:auto;bottom:10px;left:8px;right:64px;max-width:none}.goals>div{font-size:12.5px;padding:4px 8px}.goals .sub2{display:none}}
.goalbanner{pointer-events:none;position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:70;background:#fff4d6;border:4px solid var(--gold);border-radius:18px;padding:12px 20px;box-shadow:0 6px 0 #b0834b,0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .5s cubic-bezier(.2,.9,.3,1.4),fade 3.2s forwards;max-width:90vw;text-align:center}
.goalbanner b{font-size:18px;color:#c0521f}.goalbanner span{color:#3f8f4a;font-weight:800}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
/* quotes & compare */
.item .quote{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:right;margin-top:-2px}
.item .quote:empty{display:none}
.warn{color:#c0521f;font-weight:700}.okc{color:#3f8f4a;font-weight:700}
.btn.cmp{min-width:34px;padding-left:8px;padding-right:8px;font-weight:800}
.cmp{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto}
.cmph,.cmpr{display:grid;grid-template-columns:1.6fr 1fr 1fr .6fr;gap:6px;align-items:center;text-align:left}
.cmph{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;padding:0 8px}
.cmpr{background:#fff;border:2px solid #e4cfa6;border-radius:12px;padding:6px 8px;font:inherit;color:var(--ink);cursor:pointer}
.cmpr.here{border-color:var(--gold);background:#fff4d6}
.cmpr small{display:block;color:var(--muted);font-size:11px}
.cmpr i{font-style:normal;font-size:11px}
/* ledger */
.ledger h3{margin:12px 0 4px}
.lstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lstats div{background:#fff;border:2px solid #e4cfa6;border-radius:12px;padding:6px;text-align:center}
.lstats b{display:block;font-size:17px;color:#c0521f}.lstats span{font-size:11.5px;color:var(--muted)}
.lgoal{padding:2px 0}.lgoal.ok{color:#3f8f4a;font-weight:700}.lgoal small{color:#3f8f4a;font-weight:800}
.rank{margin:0;padding-left:22px}.rank li{padding:2px 0}.rank li span{margin-right:8px}.rank li b{float:right}.rank li.me{font-weight:800;color:#c0521f}
@media (max-width:480px){.lstats{grid-template-columns:repeat(2,1fr)}}
/* round 2 */
.result{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.result .die{margin-right:0;flex:none}
.rank li{display:flex;justify-content:space-between;gap:8px}.rank li b{float:none;white-space:nowrap}
.btn.danger{background:#ffe2d8!important;border-color:#e2553f!important;color:#8a2a17!important}
@media (max-width:600px){
  header.hud{flex-wrap:wrap;gap:4px;overflow:visible;padding-bottom:0}
  .pill{padding:1px 8px 1px 3px;border-width:2px}.pill .ic{transform:scale(.8)}.pill b{font-size:13px}
  #h-wx{display:none}
  .hbtn{padding:1px 8px;font-size:13px;border-width:2px}
  .pill .bar{width:34px}
}
/* fixed trade routes */
#roads{pointer-events:none}
#roads .road-b{fill:none;stroke:#fff6dc;stroke-width:4.2;stroke-linecap:round;opacity:.75}
#roads .road{fill:none;stroke:#9a6a3c;stroke-width:2;stroke-dasharray:7 5;stroke-linecap:round;opacity:.85}
#roads .sealane{fill:none;stroke:#ffffff;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;opacity:.8}
/* layers, speed, rank colours */
#map.no-routes #roads{display:none}
#map.no-borders image.terr,#map.no-borders #klabels{display:none}
.layers{position:absolute;right:58px;bottom:12px;z-index:6;background:#fff8e8;border:3px solid var(--edge);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 #b0834b;display:flex;flex-direction:column;gap:6px;min-width:190px;font-size:14px}
.layers[hidden]{display:none}
.layers b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.layers label{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.layers input{width:18px;height:18px;accent-color:#c0521f}
.layers .lg{display:flex;align-items:center;gap:8px;font-weight:600}
.layers .lg i{width:22px;height:6px;border-radius:3px;display:inline-block}
.hbtn.speed{min-width:44px;font-weight:800}
.city .crib{pointer-events:none}
.city .crown{pointer-events:none}
#klabels .klabel{transition:opacity .2s}#klabels .klabel.dim{opacity:.25}
@media (max-width:900px){.layers{right:56px;bottom:auto;top:110px}}
/* painted map */
#map.painted > path,#map.painted #decor{display:none}
#map.painted image.terr.replaced{display:none}
#map.painted image.terrfill{opacity:.42;mix-blend-mode:color}
#map.painted image.terrline{opacity:.9}
#map.no-borders image.terrfill,#map.no-borders image.terrline{display:none}
#map.painted #klabels .klabel{fill:#1f3a2a;opacity:.55}
#map.painted #roads .road-b{stroke:#5a3b1f;stroke-width:6.5;opacity:.35}
#map.painted #roads .road{stroke:#f3d9a4;stroke-width:3.6;stroke-dasharray:none;opacity:.95}
#map.painted #roads .sealane{stroke:#ffffff;stroke-width:2.6;stroke-dasharray:3 8;opacity:.85}
#roads .jn{fill:#f3d9a4;stroke:#5a3b1f;stroke-width:1.5}
/* world v2 */
#routeL path.route{fill:none}
#roads .ford{fill:#4f8fd6;stroke:#fff;stroke-width:1.4}
#roads .road.pass{stroke:#f3d9a4;stroke-dasharray:7 4}
.card.stand .sbar{position:relative;height:10px;border-radius:6px;background:rgba(91,58,36,.15);margin:8px 0 6px;overflow:hidden}
.card.stand .sbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e2a33a,#f5c542);border-radius:6px}
.card.stand .sbar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(91,58,36,.45)}
.item.locked-good{opacity:.72}
.item.locked-good .gq{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:rgba(91,58,36,.12);font-weight:800;font-size:20px;color:#7a4e2e}
/* phone: map fills the screen, panel is a bottom sheet that can be closed */
@media (max-width:900px){
  html,body{height:100%;overflow:hidden}
  .app{display:block;height:100dvh;min-height:0;overflow:hidden}
  #mapwrap{position:fixed;inset:0}
  aside{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:58dvh;margin:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
    transform:translateY(calc(100% - var(--tabsH,52px)));transition:transform .22s ease;box-shadow:0 -4px 0 #b0834b,0 -10px 30px rgba(40,30,10,.25)}
  .app.panel-open aside{transform:none}
  aside .tabs{padding-right:48px;flex:none}
  #panel{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;flex:1 1 auto;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .panelclose{display:flex;position:absolute;top:7px;right:8px;width:36px;height:36px;border-radius:12px;border:2px solid #e4cfa6;background:#fff;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;z-index:3;color:var(--ink)}
  .app:not(.panel-open) .panelclose{display:none}
  .app:not(.panel-open) aside .tabs{padding-right:6px}
  .mapctl{bottom:calc(var(--sheet,52px) + 12px);transition:bottom .22s ease}
  .goals{bottom:calc(var(--sheet,52px) + 10px)}
  .layers{top:auto;bottom:calc(var(--sheet,52px) + 64px)}
}
/* map v3 */
#map.painted image.terrfill{display:none;opacity:.38;mix-blend-mode:multiply}
#map.painted.tint image.terrfill{display:inline}
#map.painted image.terrline{opacity:1}
#map.no-borders image.terrline,#map.no-borders image.terrfill{display:none}
#map.painted #klabels .klabel.v3{opacity:.95;letter-spacing:2px;stroke:#fff6e0;stroke-width:3.5px;stroke-opacity:.9;paint-order:stroke;font-weight:900}
#map.painted #klabels .klabel.v3.free{font-style:italic;font-weight:700;opacity:.8}
#map.no-borders #klabels{display:block}
.city .clabel.crowd{font-size:.85em;opacity:.85}
#map.painted #klabels .klabel.v3.dim{opacity:.45}
/* realms v3: fog of war */
#fog{pointer-events:none}
#fog .fog-far{opacity:.93}
#fog .fog-near{opacity:.6}
#fog .fog-edge path{fill:none;stroke-width:2.2;stroke-dasharray:7 5;opacity:.85}
.city.fog2{display:none}
.city.fog1 .clabel,.city.fog1 .crown{display:none!important}
.city.fog1{filter:grayscale(1) sepia(.3);opacity:.6}
#map.painted #klabels .klabel.v3.fogged{display:none!important}
#map.painted #klabels .klabel.v3.lockedk{opacity:.8}
#map.nosea .sealane{opacity:.18}
.nextu{margin:.35em 0 .1em;font-size:.92em;color:#7a3f12}
.besthint,.prized{display:block;font-size:.88em;font-weight:700;color:#2f7d4a}
.prized{color:#9a5b0f}
.coinfly small{display:block;font-size:.62em;opacity:.9}
.unlock h3{margin-bottom:.2em}
/* kingdom names appear only once their fog lifts */
#map.painted #klabels .klabel.v3.lockedk{display:none!important}
/* Portuguese forts: their own look, name always shown */
.city.por.fog1{filter:sepia(.35) saturate(.7);opacity:.9}
.city.por.fog1 .clabel{display:inline!important}
.city.por .porflag{pointer-events:none}
#fog .fog-far{opacity:1}
/* feedback */
.dockb.fb{opacity:.92}
.fb-stars{display:flex;gap:6px;margin:.4em 0 .8em}
.fbstar{font-size:30px;line-height:1;background:none;border:0;color:#d9c9a3;cursor:pointer;min-width:44px;min-height:44px}
.fbstar.on{color:#f2a51a}
.fbl{display:block;font-weight:700;font-size:.95em;margin:.5em 0}
.fbl textarea,.fbl input{display:block;width:100%;box-sizing:border-box;margin-top:.3em;padding:.55em .7em;border:2px solid #e3d2ad;border-radius:12px;font:inherit;font-weight:400;background:#fffaf0}
.ttnote{font-size:.78em;opacity:.65;margin-top:.8em;text-align:center}
</style>

function dateOf(day){let y=1520,d=day;for(;;){const len=(y%4===0)?366:365;if(d<len)break;d-=len;y++;}let m=0;for(;;){const len=MDAYS[m]+(m===1&&y%4===0?1:0);if(d<len)break;d-=len;m++;}return {y,m,d:d+1};}
function dateStr(day){const t=dateOf(day);return `${t.d} ${MONTHS[t.m]} ${t.y}`;}
const isMonsoon = day=>{const m=dateOf(day).m;return m>=5&&m<=7;};
function proj(lat,lon){const l=lon*Math.PI/180,p=lat*Math.PI/180;return [PROJ.scale*l+PROJ.tx, PROJ.ty-PROJ.scale*Math.log(Math.tan(Math.PI/4+p/2))];}
function cxy(c){return c.offmap?proj(c.offmap.lat,c.offmap.lon):proj(c.lat,c.lon);}

// ---------- Graph ----------
const NODES = {}; DATA.cities.forEach(c=>NODES[c.id]={id:c.id,lat:c.lat,lon:c.lon});
DATA.wp.forEach(([id,lat,lon])=>NODES[id]={id,lat,lon,wp:true});
const ADJ = {}; Object.keys(NODES).forEach(id=>ADJ[id]=[]);
DATA.edges.forEach(([a,b,mode,km])=>{ADJ[a].push({to:b,mode,km});ADJ[b].push({to:a,mode,km});});
function legDays(e,mods){const sp=e.mode==='sea'?115*(1+mods.sea):22*(1+mods.land);return Math.max(1,e.km/sp);}
function dijkstra(src,mods){const dist={},prev={},done=new Set();Object.keys(NODES).forEach(k=>dist[k]=Infinity);dist[src]=0;
  for(;;){let u=null,b=Infinity;for(const k in dist)if(!done.has(k)&&dist[k]<b){b=dist[k];u=k;}if(u===null)break;done.add(u);
    for(const e of ADJ[u]){const nd=dist[u]+legDays(e,mods)+(NODES[u].wp?0:0.3);if(nd<dist[e.to]){dist[e.to]=nd;prev[e.to]={from:u,e};}}}
  return {dist,prev};}
function pathTo(src,dst,mods){const {dist,prev}=dijkstra(src,mods);if(dist[dst]===Infinity)return null;const legs=[];let x=dst;while(x!==src){const p=prev[x];legs.unshift({from:p.from,to:x,mode:p.e.mode,km:p.e.km,days:legDays(p.e,mods)});x=p.from;}return {legs,days:dist[dst]};}
// Base travel days between all cities (for price geography)
const BASEMODS={sea:0,land:0};
const DAYS = {}; DATA.cities.forEach(c=>{DAYS[c.id]=dijkstra(c.id,BASEMODS).dist;});
const PRODUCERS = {}; DATA.goods.forEach(g=>PRODUCERS[g.id]=DATA.cities.filter(c=>c.p.includes(g.id)).map(c=>c.id));
const NEAR = {}; DATA.cities.forEach(c=>{NEAR[c.id]={};DATA.goods.forEach(g=>{let m=Infinity;PRODUCERS[g.id].forEach(p=>m=Math.min(m,DAYS[c.id][p]));NEAR[c.id][g.id]=m;});});
const CAPITAL = {}; DATA.kingdoms.forEach(k=>{const cs=DATA.cities.filter(c=>c.k===k.id).sort((a,b)=>b.tier-a.tier);if(cs.length)CAPITAL[k.id]=cs[0].id;});

// ---------- State ----------
let S = null;
function newName(region,sex){return pick(NAMES[region||'south'][sex]);}
function newMember(o){return Object.assign({id:'m'+Math.random().toString(36).slice(2,8),sex:'m',age:20*365,stats:{hag:4,cmd:4,cha:4,acu:4},alive:true,spouse:null,school:true,role:null,firm:null,retired:false},o);}
function newGame(name){
  const head=newMember({name:name||'Mallappa',age:22*365,stats:{hag:ri(4,6),cmd:ri(3,6),cha:ri(3,6),acu:ri(3,6)}});
  S={v:1,day:0,coins:300,rep:0,loc:'hampi',fatigue:0,cargo:{},capLv:0,crew:[],licenses:{vij:true,free:true},influence:{},favors:{},items:[],books:[],firms:{},markets:{},missions:{},hires:{},matches:{},festivals:[],
     family:{members:[head],head:head.id,house:null},log:[],travel:null,stats:{profit:0,trades:0},house:'House of '+(name||'Mallappa'),sel:'hampi',tab:'market',petitionCD:{},generation:1};
  log(`The year is 1520. Krishnadevaraya has just taken Raichur from Bijapur. ${esc(head.name)} begins with 300 varaha in the City of Victory.`,'y');
  ensureMissions();
}
function log(t,c=''){S.log.unshift({d:S.day,t,c});if(S.log.length>120)S.log.pop();}
function head(){return S.family.members.find(m=>m.id===S.family.head);}
function member(id){return S.family.members.find(m=>m.id===id);}
const ageY = m=>Math.floor(m.age/365);
function title(){let t=TITLES[0][1];for(const [r,n] of TITLES)if(S.rep>=r)t=n;return t;}
function nextTitle(){for(const [r,n] of TITLES)if(S.rep<r)return [r,n];return null;}

// ---------- Modifiers ----------
function itemFx(key){const v=S.items.reduce((a,i)=>a+((i.fx&&i.fx[key])||0),0);return ({fatigue:0.6,bandit:0.75,pirate:0.75,storm:0.75,tax:0.04,sea:0.3,land:0.3,cap:0.3})[key]!==undefined?Math.min(v,({fatigue:0.6,bandit:0.75,pirate:0.75,storm:0.75,tax:0.04,sea:0.3,land:0.3,cap:0.3})[key]):v;}
function stat(m,k){let v=m.stats[k];if(m.id===S.family.head&&k==='cha')v+=itemFx('charm');if(m.id===S.family.head&&k==='hag')v+=itemFx('haggle');return Math.min(12,v);}
function crewIn(role){const hired=S.crew.filter(c=>c.role===role).map(c=>c.skill);const fam=S.family.members.filter(m=>m.alive&&m.role===role).map(m=>stat(m,ROLESTAT[role]));return hired.concat(fam).sort((a,b)=>b-a).slice(0,ROLES[role].max);}
function roleSkill(role){const a=crewIn(role);return a.length?a[0]:0;}
function mods(){return {sea:0.03*roleSkill('navigator')+itemFx('sea'),land:itemFx('land')+0.01*stat(head(),'cmd')};}
function capacity(){const dep=crewIn('deputy').reduce((a,s)=>a+s,0);return Math.round(CAPLV[S.capLv]*(1+0.04*dep+0.03*roleSkill('craftsman')+itemFx('cap')));}
function cargoUsed(){return Math.round(Object.entries(S.cargo).reduce((a,[g,c])=>a+c.q*G[g].wt,0)*1000)/1000;}
function haggle(){const dep=crewIn('deputy').reduce((a,s)=>a+s,0);return 0.015*(stat(head(),'hag')-4)+0.004*dep;}
function taxRate(k){if(k==='mng'&&S.items.some(i=>i.k==='mng'))return 0;return Math.max(0,K[k].tax*(1-0.07*roleSkill('accountant'))-itemFx('tax'));}
function canTrade(cid){const k=C[cid].k;return !!S.licenses[k];}
function monopolyOn(k,g){return (S.favors[k]&&S.favors[k].monopoly||[]).includes(g);}

// ---------- Markets ----------
function vfac(g){return clamp(60/G[g].base,0.05,4);}
function depth(){return 1+0.5*(S?S.capLv:0);}
function eqPrice(cid,g){const c=C[cid],gd=G[g];const prod=c.p.includes(g);let p;
  if(prod)p=gd.base*0.58;else{const d=NEAR[cid][g];p=gd.base*(gd.cat==='luxury'?1+Math.min(0.6,d/60):1+Math.min(1.15,d/42));if(gd.cat==='luxury'||gd.cat==='alcohol'&&gd.base>50)p*=c.tier>=4?1.1:(c.tier<=1?0.8:1);}
  const fest=S.festivals.find(f=>f.c===cid&&f.g===g&&f.until>=S.day);if(fest)p*=fest.mult;
  if(monopolyOn(c.k,g)&&prod)p*=0.85;if(typeof demandSpike==='function'&&demandSpike(cid,g))p*=1.3;return p;}
function sells(cid){const c=C[cid];const s=c.p.slice();if(c.tier>=4&&c.port){DATA.goods.forEach(g=>{if(!s.includes(g.id)&&NEAR[cid][g.id]<=16)s.push(g.id);});}return s;}
function stockMax(cid,g){const c=C[cid];const own=c.p.includes(g);return Math.round((own?40+c.tier*30:12+c.tier*8)*vfac(g)*depth());}
function market(cid){if(!S.markets[cid])S.markets[cid]={t:S.day,g:{}};const M=S.markets[cid];const dt=S.day-M.t;if(dt>0){for(const g in M.g){const e=M.g[g];const mx=stockMax(cid,g);e.stock=Math.min(mx,e.stock+mx*0.06*dt);e.sold*=Math.pow(0.92,dt);}M.t=S.day;}return M;}
function entry(cid,g){const M=market(cid);if(!M.g[g])M.g[g]={stock:stockMax(cid,g),sold:0};return M.g[g];}
function buyPrice(cid,g,extraStock=0){const e=entry(cid,g),mx=stockMax(cid,g);const own=C[cid].p.includes(g);const s=Math.max(0,e.stock-extraStock);return eqPrice(cid,g)*(own?1:1.15)*(1+0.7*(1-s/mx))*(1-haggle());}
function sellPrice(cid,g,extraSold=0){const e=entry(cid,g);const dem=(30+C[cid].tier*25)*vfac(g)*(C[cid].p.includes(g)?0.5:1)*depth()*(demandSpike(cid,g)?1.6:1);const f=Math.max(0.3,1-0.55*(e.sold+extraSold)/dem);let sp=eqPrice(cid,g)*0.92*f*(1+haggle()/2);if(sells(cid).includes(g))sp=Math.min(sp,0.93*buyPrice(cid,g));return sp;}
function quoteBuy(cid,g,n){let t=0;for(let i=0;i<n;i++)t+=buyPrice(cid,g,i);return t;}
function quoteSell(cid,g,n){let t=0;for(let i=0;i<n;i++)t+=sellPrice(cid,g,i);return t*(1-taxRate(C[cid].k));}
function doBuy(g,n){const cid=S.loc;if(!canTrade(cid))return toast('You need a trade licence here.');const e=entry(cid,g);n=Math.min(n,Math.floor(e.stock));if(n<=0)return toast('Nothing left to buy.');
  const room=Math.floor((capacity()-cargoUsed())/G[g].wt+1e-9);n=Math.min(n,room);if(n<=0)return toast('Your caravan is full.');
  let cost=quoteBuy(cid,g,n);while(n>0&&cost>S.coins){n--;cost=quoteBuy(cid,g,n);}if(n<=0)return toast('Not enough varaha.');
  e.stock-=n;S.coins-=cost;const cg=S.cargo[g]||{q:0,cost:0};cg.cost=(cg.cost*cg.q+cost)/(cg.q+n);cg.q+=n;S.cargo[g]=cg;S.stats.trades++;
  log(`Bought ${n} ${G[g].name} at ${C[cid].name} for ${fmt(cost)}.`);render();}
function doSell(g,n){const cid=S.loc,cg=S.cargo[g];if(!cg)return;const broker=!canTrade(cid);n=Math.min(n,cg.q);if(n<=0)return;const gross=quoteSell(cid,g,n)*(broker?0.85:1);const e=entry(cid,g);e.sold+=n;
  const profit=gross-cg.cost*n;S.coins+=gross;cg.q-=n;if(cg.q<=0)delete S.cargo[g];S.stats.profit+=profit;S.stats.trades++;
  if(profit>0)gainRep(profit/(180*(1+S.rep/150)));if(typeof coinFly==='function')coinFly(gross,profit);
  // mission credit is by delivery at court, not sale
  log(`Sold ${n} ${G[g].name} at ${C[cid].name} for ${fmt(gross)} (${profit>=0?'+':''}${fmt(profit)}).`,profit>=0?'g':'r');render();}
function gainRep(x){const before=title();S.rep+=x;const after=title();if(after!==before){log(`Your house is now known as ${after}!`,'y');toast(`New title: ${after}`);}}

// ---------- Time ----------
function advance(days,opts={}){for(let i=0;i<days;i++){const before=dateOf(S.day);S.day++;const now=dateOf(S.day);
  if(opts.rest){const home=S.family.house&&S.family.house.c===S.loc;S.fatigue=Math.max(0,S.fatigue-(home?10*(1+0.4*S.family.house.lvl):8));}
  if(now.m!==before.m)monthly();if(now.y!==before.y)yearly();}
  render();}
function monthly(){
  // wages
  let wages=S.crew.reduce((a,c)=>a+c.wage,0);if(wages>0){const left=[];while(S.crew.length&&wages>S.coins){S.crew.sort((a,b)=>b.wage-a.wage);const c=S.crew.shift();wages-=c.wage;left.push(c.name);}if(left.length){log(`You could not pay wages. ${left.join(', ')} walked off.`,'r');modal('Unpaid crew',`<p>You were short of varaha on wage day. <b>${esc(left.join(', '))}</b> left your caravan.</p><p class="sub">Keep at least a month of wages in hand. Wages are due on the 1st of each month.</p>`,[{t:'I will do better',f:()=>null}]);}S.coins-=wages;}
  // firms
  let inc=0;for(const cid in S.firms){const f=S.firms[cid];const mgr=f.manager?member(f.manager):null;const acu=mgr&&mgr.alive?stat(mgr,'acu'):2;const k=C[cid].k;
    const mono=C[cid].p.some(g=>monopolyOn(k,g));const capS=Math.min(0.9,0.15+0.1*f.lvl+(mono?0.15:0));f.share=Math.min(capS,f.share+0.01*(1.5+acu*0.5+f.lvl));
    const val=200*Math.pow(C[cid].tier,1.55)*(1+0.3*(f.lvl-1));const m=f.share*val*(mono?1.6:1)*(0.85+acu*0.03)-0.05*val*f.lvl;f.last=m;inc+=m;}
  if(inc!==0&&Object.keys(S.firms).length){S.coins+=inc;if(inc>0)gainRep(inc/(400*(1+S.rep/150)));log(inc>0?`Your firms remitted ${fmt(inc)} varaha this month, after upkeep.`:`Your firms cost ${fmt(-inc)} varaha in upkeep this month.`,inc>0?'g':'r');}
  // family aging & births
  const fam=S.family.members.filter(m=>m.alive);
  const md=MDAYS[dateOf(S.day-1).m]+((dateOf(S.day-1).m===1&&dateOf(S.day-1).y%4===0)?1:0);fam.forEach(m=>{m.age+=md;if(ageY(m)>=50&&Math.random()<0.002*(ageY(m)-48)){die(m);}});
  const h=head();if(h&&h.spouse&&S.family.house){const sp=member(h.spouse);const room=S.family.members.filter(m=>m.alive).length<HOUSE[S.family.house.lvl].cap;
    const mother=h.sex==='f'?h:sp;S.noBirth=(S.noBirth||0)+1;if(sp&&sp.alive&&room&&ageY(mother)<44&&Math.random()<Math.min(0.15,0.035+0.006*S.noBirth)){S.noBirth=0;birth(h,sp);}}
  S.family.members.filter(m=>m.alive&&m.spouse&&m.id!==S.family.head&&m.spouse!==S.family.head&&m.sex==='m').forEach(m=>{const sp=member(m.spouse);const room=S.family.members.filter(x=>x.alive).length<(S.family.house?HOUSE[S.family.house.lvl].cap:0);if(sp&&sp.alive&&room&&ageY(sp)<44&&Math.random()<0.03)birth(m,sp);});
  // festivals
  S.festivals=S.festivals.filter(f=>f.until>=S.day);
  S.spikes=(S.spikes||[]).filter(f=>f.until>=S.day);{const c=pick(DATA.cities.filter(c=>c.p.length&&c.tier>=2));const g=pick(c.p);S.festivals.push({c:c.id,g,mult:0.6,until:S.day+40});log(`Rumour: a glut of ${G[g].name} at ${c.name}. It will be cheap there for a few weeks.`,'y');}
  {const c=pick(DATA.cities.filter(c=>c.tier>=3&&canTrade(c.id)));if(c){const cands=DATA.goods.filter(g=>!c.p.includes(g.id));const g=pick(cands).id;S.spikes.push({c:c.id,g,until:S.day+45});log(`Rumour: ${C[c.id].name} is hungry for ${G[g].name} — it will pay far more than usual for six weeks.`,'y');}}
  // mission expiry
  for(const k in S.missions){const m=S.missions[k];if(m&&m.due<S.day){if(m.accepted){log(`You failed the ${K[k].title}'s commission. Influence in ${K[k].name} falls.`,'r');S.influence[k]=Math.max(0,(S.influence[k]||0)-6);}else log(`The ${K[k].title} of ${K[k].name} gave the commission for ${G[m.g].name} to another house.`);S.missions[k]=null;}}
  ensureMissions();S.hires={};S.matches={};
  // family dice event
  if(Math.random()<0.2)familyEvent();
  autosave();}
function yearly(){
  const lvl=S.family.house?C[S.family.house.c].tier:1;
  S.family.members.filter(m=>m.alive&&ageY(m)<16).forEach(m=>{const a=ageY(m);if(a<5)return;const fee=8*lvl*lvl;let g=0.04;if(m.school&&S.family.house){if(S.coins>=fee){S.coins-=fee;g=0.03*lvl;}else log(`Could not pay school fees for ${m.name}.`,'r');}
    for(const k in m.stats)m.stats[k]=m.stats[k]>=8?m.stats[k]:Math.min(8,m.stats[k]+g*rnd(0.6,1.4));});
  S.family.members.filter(m=>m.alive&&ageY(m)===16).forEach(m=>log(`${esc(m.name)} has come of age and can now work for the house.`,'y'));
  log(`A new year: ${dateOf(S.day).y}.`,'y');}
function birth(a,b){const sex=Math.random()<0.5?'m':'f';const reg=KREG[C[S.family.house.c].k];const st={};for(const k in a.stats)st[k]=clamp((a.stats[k]+b.stats[k])/2+rnd(-1,1),1,10);
  const kid=newMember({name:newName(reg,sex),sex,age:0,stats:st,parents:[a.id,b.id]});S.family.members.push(kid);log(`A ${sex==='m'?'son':'daughter'}, ${esc(kid.name)}, is born to ${esc(a.name)} and ${esc(b.name)}.`,'g');toast(`A child is born: ${kid.name}`);}
function die(m){m.alive=false;m.role=null;if(m.spouse){const sp=member(m.spouse);if(sp&&sp.spouse===m.id)sp.spouse=null;}if(m.firm&&S.firms[m.firm])S.firms[m.firm].manager=null;log(`${esc(m.name)} has died at ${ageY(m)}.`,'r');
  if(m.id===S.family.head){const heirs=S.family.members.filter(x=>x.alive&&ageY(x)>=16&&!x.retired);if(!heirs.length){gameOver();return;}openSuccession(true);}}

// ---------- Travel ----------
let travelTimer=null;
function startTravel(dst){if(S.travel)return;const p=pathTo(S.loc,dst,mods());if(!p)return toast('No route.');
  if(cargoUsed()>capacity()+1e-6)return toast('Too much cargo to move. Sell or drop some first.');
  S.travel={dst,legs:p.legs,li:0,prog:0,days:0};log(`Set out from ${C[S.loc].name} for ${C[dst].name} (~${Math.ceil(p.days)} days).`);tickTravel();}
function tickTravel(){clearTimeout(travelTimer);if(!S.travel||modalOpen())return;const T=S.travel;const leg=T.legs[T.li];
  // one day
  const before=dateOf(S.day);S.day++;T.days++;const now=dateOf(S.day);if(now.m!==before.m)monthly();if(now.y!==before.y)yearly();if(!S.travel)return;
  const fg=(leg.mode==='sea'?0.8:1.3)*(1-0.05*roleSkill('cook'))*(1-itemFx('fatigue'));S.fatigue=Math.min(100,S.fatigue+fg);
  const slow=S.fatigue>85?0.75:1;const monsoon=leg.mode==='sea'&&isMonsoon(S.day);
  T.prog+=slow*(monsoon?0.8:1)/leg.days;
  roadEvent(leg,monsoon);
  if(T.prog>=1){T.prog=0;T.li++;const at=leg.to;if(!NODES[at].wp){S.loc=at;}if(T.li>=T.legs.length){arrive();return;}}
  render();if(!modalOpen())travelTimer=setTimeout(tickTravel,S.fast?25:(typeof travelDelay==='function'?travelDelay():90));}
function arrive(){const T=S.travel;S.travel=null;S.loc=T.dst;S.sel=T.dst;log(`Arrived at ${C[T.dst].name} after ${T.days} days.`,'y');if(!canTrade(T.dst))toast(`You need a trade licence for ${K[C[T.dst].k].name}.`);S.tab='market';autosave();render();centerOn(T.dst);}
function roadEvent(leg,monsoon){const r=Math.random();const k=C[S.loc]?C[S.loc].k:'free';
  if(leg.mode==='land'){let p=0.006*(1-itemFx('bandit'))*((S.favors[k]&&S.favors[k].protection)?0.5:1);if(r<p)return ambush('bandits');}
  else{let p=0.005*(1-itemFx('pirate'));if(r<p)return ambush('pirates');let ps=(monsoon?0.012:0.003)*(1-0.06*roleSkill('navigator'))*(1-itemFx('storm'));if(r>0.5&&r<0.5+ps)return storm();}
  if(r>0.97&&r<0.972)return windfall();
  if(S.fatigue>70&&r>0.9&&r<0.9+0.004)return illness();}
function loseCargo(f){const lost=[];for(const g in S.cargo){const c=S.cargo[g];const n=Math.floor(c.q*f+(Math.random()<c.q*f%1?1:0));if(n>0){c.q-=n;lost.push(`${n} ${G[g].name}`);if(c.q<=0)delete S.cargo[g];}}return lost;}
function ambush(kind){const guard=roleSkill('guard');const cmd=stat(head(),'cmd');
  modal(`${kind==='bandits'?'Bandits on the road':'Pirates off the bow'}`,`<p>${kind==='bandits'?'Horsemen block the road ahead and demand a toll.':'A fast prau closes on your ship, grapnels ready.'} Your ${guard?'guard (skill '+guard+')':'caravan has no guard'}.</p>`,[
    {t:`Fight — ${chance(guard+Math.floor(cmd/2),15)} (guard ${guard}, command ${Math.floor(cmd/2)})`,f:()=>{const roll=d20();const tot=roll+guard+Math.floor(cmd/2);if(tot>=15){const loot=ri(20,80)*(1+S.capLv);S.coins+=loot;gainRep(2);return `${dieHTML(roll)}Rolled ${roll} (total ${tot}). You drive them off and take ${loot} varaha from their packs.`;}const lost=loseCargo(0.25);const c=Math.floor(Math.min(S.coins*0.1,150+60*S.capLv));S.coins-=c;S.fatigue=Math.min(100,S.fatigue+15);return `${dieHTML(roll)}Rolled ${roll} (total ${tot}). They break through. Lost ${c} varaha${lost.length?' and '+lost.join(', '):''}.`;}},
    {t:`Pay them off — ${fmt(tollFor())} varaha`,f:()=>{const c=tollFor();S.coins=Math.max(0,S.coins-c);return `You pay ${c} varaha and they let you pass.`;}},
    {t:`Run — ${chance(cmd,13)} (command ${cmd})`,f:()=>{const roll=d20();if(roll+cmd>=13)return `${dieHTML(roll)}Rolled ${roll}. You slip away in the dust.`;const lost=loseCargo(0.12);return `${dieHTML(roll)}Rolled ${roll}. They catch your rear carts: lost ${lost.join(', ')||'nothing of value'}.`;}},
  ]);}
function storm(){const cr=roleSkill('craftsman');modal('A storm breaks',`<p>The monsoon sky turns black. Waves come over the gunwale.</p>`,[
  {t:`Jettison cargo to stay afloat`,f:()=>{const lost=loseCargo(0.15);return `You throw overboard ${lost.join(', ')||'a few empty jars'}. The ship rides it out.`;}},
  {t:`Trust the hull — ${chance(cr,14)} (craftsman ${cr})`,f:()=>{const roll=d20();if(roll+cr>=14)return `${dieHTML(roll)}Rolled ${roll}. The seams hold. Not a bale lost.`;const lost=loseCargo(0.35);return `${dieHTML(roll)}Rolled ${roll}. Water floods the hold: lost ${lost.join(', ')||'nothing'}.`;}},
  ]);}
function windfall(){const g=pick(Object.keys(G).filter(x=>G[x].base<120));const n=ri(2,8);const room=capacity()-cargoUsed();const q=Math.max(0,Math.min(n,Math.floor(room/G[g].wt)));
  modal('A lucky find',`<p>A broken-down trader offers you ${n} ${G[g].name} for almost nothing before turning home.</p>`,[{t:q?`Take ${q} ${G[g].name}`:'No room — wave him on',f:()=>{if(q>0){const c=S.cargo[g]||{q:0,cost:0};c.cost=(c.cost*c.q)/(c.q+q);c.q+=q;S.cargo[g]=c;}return q?`You load ${q} ${G[g].name}.`:'No room — you wave him on.';}}]);}
function illness(){modal('Fever on the road',`<p>The road has worn you down. A fever keeps you in your tent.</p>`,[{t:'Rest a few days',f:()=>{const tr=S.travel;S.travel=null;advance(4,{rest:true});S.travel=tr;return 'You lose four days but the rest does you good.';}}]);}

// ---------- Kingdom & court ----------
function ensureMissions(){DATA.kingdoms.forEach(k=>{if(k.free||!CAPITAL[k.id]||!S.licenses[k.id])return;if(S.missions[k.id]===undefined||S.missions[k.id]===null&&Math.random()<0.35)S.missions[k.id]=makeMission(k.id);});}
function makeMission(k){const cap=CAPITAL[k];const own=new Set(DATA.cities.filter(c=>c.k===k).flatMap(c=>c.p));const cands=DATA.goods.filter(g=>!own.has(g.id)&&NEAR[cap][g.id]<70);const g=pick(cands.length?cands:DATA.goods);
  const inf=S.influence[k]||0;const target=g.wt*g.base>0?Math.max(1,Math.round((8+inf*0.6)*Math.min(4,40/g.base+0.3))):5;const q=clamp(target,1,120);
  const val=eqPrice(cap,g.id)*q;return {g:g.id,q,due:S.day+ri(120,240),reward:Math.round(val*2.5),inf:ri(10,16),accepted:false};}
function deliver(k){const m=S.missions[k];const c=S.cargo[m.g];if(!c||c.q<m.q)return;c.q-=m.q;if(c.q<=0)delete S.cargo[m.g];S.coins+=m.reward;S.influence[k]=Math.min(100,(S.influence[k]||0)+m.inf);gainRep(m.inf*0.8);
  log(`The ${K[k].title} is pleased with your ${G[m.g].name}. +${fmt(m.reward)} varaha, +${m.inf} influence in ${K[k].name}.`,'g');toast('Commission fulfilled');S.missions[k]=null;checkFavors(k);S.stats.comms=(S.stats.comms||0)+1;autosave();render();}
function checkFavors(k){const inf=S.influence[k]||0;S.favors[k]=S.favors[k]||{monopoly:[]};const F=S.favors[k];
  if(inf>=25&&!F.protection){F.protection=true;log(`${K[k].ruler} grants royal protection on the roads of ${K[k].name}.`,'y');}
  if(inf>=85&&!F.honour){F.honour=true;gainRep(25);log(`You are named Friend of the ${K[k].title} — an honour few foreigners receive.`,'y');}}
function buyLicence(k){const kk=K[k];if(S.rep<kk.entry.rep)return toast(`Needs reputation ${kk.entry.rep}.`);if(S.coins<kk.entry.fee)return toast('Not enough varaha.');S.coins-=kk.entry.fee;S.licenses[k]=true;log(`Bought a trade licence for ${kk.name}.`,'y');render();}
function requestItem(k){const F=S.favors[k]=S.favors[k]||{monopoly:[]};if(F.item)return;const it=Object.assign({k},ITEMS[k]||ITEM_DEFAULT(k));S.items.push(it);F.item=true;log(`${K[k].ruler} presents you with: ${it.name}. ${it.desc}`,'y');modal('A royal gift',`<p><b>${esc(it.name)}</b></p><p>${esc(it.desc)}</p>`,[{t:'Accept with thanks',f:()=>null}]);render();}
function petition(k,g){if((S.petitionCD[k]||0)>S.day)return toast('The court will not hear you again so soon.');
  let wins=0,round=0;const h=head();const inf=S.influence[k]||0;const giftCost=Math.round(Math.max(G[g].base*12,S.coins*0.02));const held=(S.favors[k]&&S.favors[k].monopoly||[]).length;const DC=r=>14+r*2+held*3;
  const step=(msg)=>{round++;if(round>3||wins>=2||round-1-wins>=2){finish(msg);return;}
    modal(`Petition for the ${G[g].name} monopoly — audience ${round} of 3`,`${msg?`<p>${msg}</p>`:''}<p>Win two of three audiences with ${esc(K[k].ruler)}.</p><p class="sub">Successes so far: ${wins}</p>`,[
      {t:`Flatter the court — ${chance(stat(h,'cha')+Math.floor(inf/10),DC(round))} (Charm ${stat(h,'cha')}, influence +${Math.floor(inf/10)})`,f:()=>{const r=d20(),t=r+stat(h,'cha')+Math.floor(inf/10);const ok=t>=DC(round);if(ok)wins++;return ()=>step(`${dieHTML(r)}Rolled ${r} (total ${t}). ${ok?'The courtiers murmur approval.':'A minister yawns.'}`);}},
      {t:`Argue the revenue to the treasury — ${chance(stat(h,'acu')+Math.floor(inf/10),DC(round))} (Acumen ${stat(h,'acu')})`,f:()=>{const r=d20(),t=r+stat(h,'acu')+Math.floor(inf/10);const ok=t>=DC(round);if(ok)wins++;return ()=>step(`${dieHTML(r)}Rolled ${r} (total ${t}). ${ok?'The treasurer nods slowly.':'The numbers fail to impress.'}`);}},
      {t:`Present a gift of ${fmt(giftCost)} varaha — ${chance(6+Math.floor(inf/10),DC(round))}`,dis:S.coins<giftCost,f:()=>{S.coins-=giftCost;const r=d20(),t=r+6+Math.floor(inf/10);const ok=t>=DC(round);if(ok)wins++;return ()=>step(`${dieHTML(r)}Rolled ${r} (total ${t}). ${ok?'The gift is received warmly.':'The gift is accepted, coolly.'}`);}},
    ]);};
  const finish=(msg)=>{const F=S.favors[k]=S.favors[k]||{monopoly:[]};S.petitionCD[k]=S.day+(wins>=2?180:60);if(wins>=2){F.monopoly.push(g);gainRep(15);log(`${K[k].ruler} grants your house the monopoly on ${G[g].name} in ${K[k].name}.`,'y');modal('Monopoly granted',`<p>${msg}</p><p>Your house now holds the royal monopoly on <b>${G[g].name}</b> in ${K[k].name}. Your firms there earn 60% more, gain market share faster, and you buy it 15% cheaper.</p>`,[{t:'Splendid',f:()=>null}]);}
    else{S.influence[k]=Math.max(0,inf-5);modal('Petition refused',`<p>${msg}</p><p>The ${K[k].title} declines. Influence −5. You may petition again in 60 days.</p>`,[{t:'Withdraw',f:()=>null}]);}render();};
  step('');}

// ---------- Crew ----------
function hiresAt(cid){if(!S.hires[cid]){const c=C[cid];const list=[];const n=c.tier>=3?4:c.tier>=2?3:1;for(let i=0;i<n;i++){const spec=c.t.length&&Math.random()<0.7;const role=spec?pick(c.t):pick(Object.keys(ROLES));const sk=spec?ri(5,9):ri(2,6);const sex=Math.random()<0.15?'f':'m';
  list.push({id:'h'+Math.random().toString(36).slice(2,7),name:newName(KREG[c.k],sex),role,skill:sk,wage:Math.round(8+Math.pow(sk,1.6)*3),from:c.name,spec});}S.hires[cid]=list;}return S.hires[cid];}
function hire(id){const list=hiresAt(S.loc);const h=list.find(x=>x.id===id);if(!h)return;const have=S.crew.filter(c=>c.role===h.role).length+S.family.members.filter(m=>m.alive&&m.role===h.role).length;if(have>=ROLES[h.role].max)return toast(`You already have a ${ROLES[h.role].name.toLowerCase()}. Dismiss one first.`);
  const fee=h.wage;if(S.coins<fee)return toast('Not enough varaha for the signing fee.');S.coins-=fee;S.crew.push(h);S.hires[S.loc]=list.filter(x=>x!==h);log(`Hired ${h.name} of ${h.from} as ${ROLES[h.role].name.toLowerCase()} (skill ${h.skill}).`);render();}
function fire(id){S.crew=S.crew.filter(c=>c.id!==id);render();}

// ---------- Firms ----------
const firmCost=cid=>Math.round(250*Math.pow(C[cid].tier,1.5));
function openFirm(){const cid=S.loc;if(S.firms[cid])return;const c=firmCost(cid);if(S.coins<c)return toast('Not enough varaha.');S.coins-=c;S.firms[cid]={lvl:1,share:0.05,manager:null,last:0};gainRep(5);log(`Opened a trading firm at ${C[cid].name}.`,'y');render();}
function upFirm(cid){const f=S.firms[cid];if(f.lvl>=5)return;const c=firmCost(cid)*(f.lvl+1);if(S.coins<c)return toast('Not enough varaha.');S.coins-=c;f.lvl++;gainRep(3);render();}

// ---------- Family ----------
function buyHouse(){const cid=S.loc;if(!canTrade(cid))return toast('Buy a trade licence here first.');const h=HOUSE[1];if(S.coins<h.cost)return toast('Not enough varaha.');
  const keep=S.family.house;if(keep&&!modalOpen()){modal('Move house?',`<p>Your family lives in ${C[keep.c].name}. Moving resets the house to a thatched house here.</p>`,[{t:'Move the family',f:()=>{doBuyHouse(cid);return null;}},{t:'Stay',f:()=>null}]);return;}doBuyHouse(cid);}
function doBuyHouse(cid){S.coins-=HOUSE[1].cost;S.family.house={c:cid,lvl:1};gainRep(3);log(`Bought a thatched house in ${C[cid].name}. A home at last.`,'y');render();}
function upHouse(){const H=S.family.house;if(!H||S.loc!==H.c)return;const nx=HOUSE[H.lvl+1];if(!nx)return;if(C[H.c].tier<nx.minTier)return toast(`A ${nx.name.toLowerCase()} needs a bigger city.`);
  if(S.coins<nx.cost)return toast('Not enough varaha.');for(const g in nx.goods)if(!S.cargo[g]||S.cargo[g].q<nx.goods[g])return toast(`Bring ${nx.goods[g]} ${G[g].name}.`);
  S.coins-=nx.cost;for(const g in nx.goods){S.cargo[g].q-=nx.goods[g];if(S.cargo[g].q<=0)delete S.cargo[g];}H.lvl++;gainRep(H.lvl*5);log(`Your home is now a ${nx.name.toLowerCase()}.`,'y');toast(`House upgraded: ${nx.name}`);render();}
function matchTier(){return S.rep<25?0:S.rep<90?1:S.rep<240?2:3;}
function matchesAt(cid,forId){const key=cid+':'+forId;if(!S.matches[key]){const p=member(forId);const sex=p.sex==='m'?'f':'m';const reg=KREG[C[cid].k];const list=[];
  for(let t=0;t<4;t++){const lo=[2,3,4,5][t],hi=[5,7,8,9][t];const st={hag:rnd(lo,hi),cmd:rnd(lo,hi),cha:rnd(lo,hi),acu:rnd(lo,hi)};list.push({id:'c'+t+Math.random().toString(36).slice(2,6),name:newName(reg,sex),sex,tier:t,stats:st,age:(ri(17,26))*365,cost:[60,250,900,3000][t],rep:[0,25,90,240][t],family:['a farming family','a merchant family','a minister\'s household','a royal kinsman\'s house'][t]});}
  S.matches[key]=list;}return S.matches[key];}
function marry(forId,cid){const p=member(forId);const c=matchesAt(S.loc,forId).find(x=>x.id===cid);if(!c)return;if(S.rep<c.rep)return toast(`Needs reputation ${c.rep}.`);if(S.coins<c.cost)return toast('Not enough varaha for the wedding.');
  if(S.family.members.filter(m=>m.alive).length>=HOUSE[S.family.house.lvl].cap)return toast('No room in your house.');
  S.coins-=c.cost;const sp=newMember({name:c.name,sex:c.sex,age:c.age,stats:c.stats,spouse:p.id});S.family.members.push(sp);p.spouse=sp.id;gainRep(4+c.tier*4);S.matches={};log(`${esc(p.name)} marries ${esc(c.name)} of ${c.family} in ${C[S.loc].name}.`,'g');toast('A wedding!');render();}
function useBook(bid,mid){const i=S.books.indexOf(bid);if(i<0)return;const b=BOOKS.find(x=>x.id===bid);const m=member(mid);if(ageY(m)<16)return toast('Books are for adults; children learn at school.');if(m.stats[b.stat]>=10)return toast(`${m.name} has nothing more to learn from it.`);const yr=dateOf(S.day).y;if(m.bookYear===yr)return toast(`${m.name} has already studied a book this year.`);m.bookYear=yr;m.stats[b.stat]=Math.min(10,m.stats[b.stat]+1);S.books.splice(i,1);log(`${esc(m.name)} studies the ${b.name}: +1 ${STAT[b.stat]}.`,'g');render();}
function bookCost(){return Math.round(350*Math.pow(1.5,S.booksBought||0));}
function buyBook(bid){const b=BOOKS.find(x=>x.id===bid);const cost=bookCost();if(S.coins<cost)return toast('Not enough varaha.');S.coins-=cost;S.booksBought=(S.booksBought||0)+1;S.books.push(bid);render();}
function familyEvent(){const adults=S.family.members.filter(m=>m.alive&&ageY(m)>=16);if(!adults.length)return;const m=pick(adults);
  const evs=[
    ['A dispute in the bazaar','A spice seller accuses '+m.name+' of short weights. A crowd gathers.',[['Recite the scales from memory','hag'],['Charm the crowd','cha']]],
    ['A night attack on the warehouse','Thieves are cutting through the warehouse wall.',[['Lead the watchmen','cmd'],['Set a trap','acu']]],
    ['An invitation to the governor\'s feast','The governor seats '+m.name+' beside a famous poet.',[['Trade verses','cha'],['Talk shop with the treasurer','acu']]],
    ['A ledger that will not balance','The accounts are off by a hundred varaha.',[['Audit every page','acu'],['Haggle a refund from the broker','hag']]],
  ];const [t,d,ch]=pick(evs);
  modal(t,`<p>${esc(d)}</p><p class="sub">${esc(m.name)}: ${Object.entries(m.stats).map(([k,v])=>STAT[k]+' '+Math.floor(v)).join(' · ')}</p>`,ch.map(([lab,st])=>({t:`${lab} — ${chance(Math.floor(stat(m,st)),15)} (${STAT[st]} ${Math.floor(stat(m,st))})`,f:()=>{const r=d20(),tot=r+Math.floor(stat(m,st));if(tot>=15){const gain=r>=18?1:0.5;m.stats[st]=Math.min(10,m.stats[st]+gain);gainRep(1);return `${dieHTML(r)}Rolled ${r} (total ${tot}). Success: ${esc(m.name)} gains ${gain} ${STAT[st]}.`;}const loss=ri(10,40);S.coins=Math.max(0,S.coins-loss);return `${dieHTML(r)}Rolled ${r} (total ${tot}). It goes badly and costs ${loss} varaha.`;}})));}
function openSuccession(forced){const adults=S.family.members.filter(x=>x.alive&&ageY(x)>=16&&x.id!==S.family.head&&!x.retired);const blood=adults.filter(x=>x.parents);const heirs=blood.length?blood:(forced?adults:[]);if(!heirs.length)return toast('No adult heir yet.');
  modal(forced?'The head of the house has died':'Retire and pass on the house',`<p>Choose who will lead the ${esc(S.house)}.</p>`,heirs.map(h=>({t:`${h.name}, ${ageY(h)} — ${Object.entries(h.stats).map(([k,v])=>STAT[k][0]+Math.floor(v)).join(' ')}`,f:()=>{const old=head();if(old&&old.alive){old.retired=true;old.role=null;}h.role=null;S.family.head=h.id;if(h.parents&&old&&h.parents.includes(old.id))S.generation++;log(`${esc(h.name)} now leads the house — generation ${S.generation}.`,'y');return null;}})));}
function gameOver(){modal('The house has fallen',`<p>With no adult heir, your house is broken up among creditors. Final reputation: ${fmt(S.rep)} (${title()}).</p>`,[{t:'Start a new house',f:()=>{try{localStorage.removeItem('srt-save');}catch(e){}location.reload();}}]);}

// ---------- Save ----------
function autosave(){try{localStorage.setItem('srt-save',JSON.stringify(S));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem('srt-save');return s?JSON.parse(s):null;}catch(e){return null;}}

// ---------- UI: modal & toast ----------
let modalQueue=[];
function modalOpen(){return !!$('#overlay').firstChild;}
function modal(title,html,choices){modalQueue.push({title,html,choices});if(!modalOpen())showModal();}
function showModal(){const m=modalQueue.shift();if(!m)return;const ov=$('#overlay');ov.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m.title)}"><h2>${esc(m.title)}</h2><div>${m.html}</div><div class="choices"></div></div></div>`;
  const box=ov.querySelector('.choices');m.choices.forEach(c=>{const b=document.createElement('button');b.className='btn';b.textContent=c.t;if(c.dis)b.disabled=true;b.onclick=()=>{const res=c.f();if(typeof res==='function'){ov.innerHTML='';res();return;}if(res){box.innerHTML='';const p=document.createElement('p');p.className='result';p.innerHTML=res;box.before(p);const ok=document.createElement('button');ok.className='btn';ok.textContent='Continue';ok.onclick=closeModal;box.appendChild(ok);ok.focus();render();}else closeModal();};box.appendChild(b);});
  const f=box.querySelector('button');if(f)f.focus();}
function closeModal(){$('#overlay').innerHTML='';render();if(modalQueue.length)showModal();else if(S&&S.travel)travelTimer=setTimeout(tickTravel,typeof travelDelay==='function'?travelDelay():90);}
let toastT=null;function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600);}

// ---------- Map ----------
const svg=$('#map');let VB={x:0,y:0,w:PROJ.W,h:PROJ.H};
function buildMap(){let s=`<defs><radialGradient id="seaG" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#1b2a4c"/><stop offset="1" stop-color="#0f1931"/></radialGradient></defs><rect x="-2000" y="-2000" width="${PROJ.W+4000}" height="${PROJ.H+4000}" fill="url(#seaG)"/>`;
  // rhumb lines from two compass hubs, in the portolan manner
  [[...proj(-14,72)],[...proj(4,88)]].forEach(([hx,hy])=>{for(let i=0;i<32;i++){const a=i*Math.PI/16;s+=`<line class="rhumb" x1="${hx}" y1="${hy}" x2="${hx+Math.cos(a)*1600}" y2="${hy+Math.sin(a)*1600}"/>`;}});
  s+=`<path class="landp" d="${LAND_PATH}"/>`;
  const [rx,ry]=proj(-17,70);s+=`<g transform="translate(${rx},${ry})" opacity=".55"><circle r="46" fill="none" stroke="#e3b04b" stroke-width="1"/><circle r="38" fill="none" stroke="#e3b04b" stroke-width=".6"/>${[0,1,2,3].map(i=>`<path d="M0,-44 L7,0 L0,44 L-7,0Z" fill="#e3b04b" fill-opacity="${i%2?'.35':'.8'}" transform="rotate(${i*45})"/>`).join('')}<text y="-52" text-anchor="middle" fill="#e3b04b" font-size="14" font-family="Rozha One">N</text></g>`;
  // kingdom labels
  DATA.kingdoms.forEach(k=>{const cs=DATA.cities.filter(c=>c.k===k.id&&!c.offmap);if(cs.length<2&&!['mng','tib','kas','kab','shy','aho','ter','mad','mdv'].includes(k.id))return;if(!cs.length)return;let x=0,y=0;cs.forEach(c=>{const p=cxy(c);x+=p[0];y+=p[1];});x/=cs.length;y/=cs.length;
    const sz=k.id==='vij'||k.id==='saf'||k.id==='mng'||k.id==='del'?16:11;s+=`<text class="klabel" x="${x}" y="${y+(k.id==='vij'?40:28)}" font-size="${sz}">${esc(k.name.replace(/^(Kingdom of |Sultanate of )/,''))}</text>`;});
  s+=`<g id="routeL"></g><g id="cities"></g><g id="caravan"><circle r="9" fill="#e3b04b" stroke="#0e172b" stroke-width="2"/><text text-anchor="middle" y="4" font-size="10" fill="#1a1405" font-weight="700">◆</text></g>`;
  svg.innerHTML=s;
  const g=$('#cities');DATA.cities.forEach(c=>{const [x,y]=cxy(c);const r=2.5+c.tier*1.4;const el=document.createElementNS('http://www.w3.org/2000/svg','g');el.setAttribute('class','city');el.setAttribute('data-id',c.id);el.setAttribute('transform',`translate(${x},${y})`);el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',c.name);
    el.innerHTML=`${c.port?`<circle class="ring" r="${r+3.5}"/>`:''}<circle class="dot" r="${r}" fill="${K[c.k].color}"/><text x="${r+4}" y="4">${esc(c.name)}${c.offmap?' →':''}</text>`;el.onclick=()=>selectCity(c.id);el.onkeydown=e=>{if(e.key==='Enter')selectCity(c.id);};g.appendChild(el);});
  setVB();}
function setVB(){svg.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);const z=PROJ.W/VB.w;document.querySelectorAll('.city').forEach(el=>{const c=C[el.dataset.id];const t=el.querySelector('text');t.style.display=(c.tier>=4||z>1.4&&c.tier>=3||z>2.2&&c.tier>=2||z>3)?'':'none';t.style.fontSize=(12/Math.sqrt(z)*1.3)+'px';});}
function zoom(f,cx,cy){const b=$('#mapwrap').getBoundingClientRect();const ar=(b.width/b.height)||1;const nw=clamp(VB.w/f,PROJ.W/7,Math.min(PROJ.W,PROJ.H*ar));const r=nw/VB.w;cx=cx??VB.x+VB.w/2;cy=cy??VB.y+VB.h/2;VB.x=cx-(cx-VB.x)*r;VB.y=cy-(cy-VB.y)*r;VB.h=VB.h*r;VB.w=nw;setVB();}
function fitInitial(){const box=$('#mapwrap').getBoundingClientRect();const ar=box.width/box.height||1;VB.w=PROJ.W*0.62;VB.h=VB.w/ar;centerOn(S?S.loc:'hampi');}
function centerOn(cid){const [x,y]=cxy(C[cid]);VB.x=x-VB.w/2;VB.y=y-VB.h/2;setVB();}
(function panzoom(){const w=$('#mapwrap');let drag=null;
  w.addEventListener('pointerdown',e=>{if(e.target.closest('.city,.mapctl,.legend'))return;drag={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y};w.classList.add('drag');w.setPointerCapture(e.pointerId);});
  w.addEventListener('pointermove',e=>{if(!drag)return;const b=$('#mapwrap').getBoundingClientRect();const s=VB.w/b.width;VB.x=drag.vx-(e.clientX-drag.x)*s;VB.y=drag.vy-(e.clientY-drag.y)*s;setVB();});
  w.addEventListener('pointerup',()=>{drag=null;w.classList.remove('drag');});

    h+=`<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(m.name)}</b> ${isHead?'<span class="chip gold">Head</span>':''}${m.retired?'<span class="chip">Retired</span>':''} <span class="sub">${m.sex==='m'?'♂':'♀'} ${a}${sp?' · married to '+esc(sp.name):''}</span></div></div>
      <div class="statpills">${Object.keys(STAT).map(k=>`<span>${STAT[k]} ${Math.floor(stat(m,k))}</span>`).join('')}</div>`;
    if(a<16)h+=`<div class="row"><span class="sub">${a<5?'Too young for school.':m.school?`At school in ${H?esc(C[H.c].name):'—'} (${TIER[H?C[H.c].tier:1].toLowerCase()} school)`:'Not in school'}</span>${a>=5?`<button class="btn ghost sm" data-act="school" data-x="${m.id}">${m.school?'Withdraw':'Enrol'}</button>`:''}</div>`;
    else if(!isHead&&!m.retired)h+=`<div class="row"><label class="sub" for="r-${m.id}">Work</label><select id="r-${m.id}" class="qty" style="width:auto"><option value="">At home</option>${Object.keys(ROLES).map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${ROLES[r].name} (${STAT[ROLESTAT[r]]} ${Math.floor(stat(m,ROLESTAT[r]))})</option>`).join('')}</select><button class="btn sm" data-act="role" data-x="${m.id}">Assign</button>${m.firm?`<span class="chip">Runs firm at ${esc(C[m.firm].name)}</span>`:''}</div>`;
    h+=`</div>`;});
  if(S.books.length){const adults=alive.filter(m=>ageY(m)>=16);h+=`<div class="card"><h3>Your library</h3>${S.books.map(b=>{const B=BOOKS.find(x=>x.id===b);return `<div class="row"><span>${esc(B.name)} (+1 ${STAT[B.stat]})</span><select class="qty" style="width:auto" aria-label="Reader">${adults.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><button class="btn sm" data-act="usebook" data-x="${b}">Study</button></div>`;}).join('')}</div>`;}
  const heirs=alive.filter(m=>ageY(m)>=16&&m.id!==S.family.head&&!m.retired&&m.parents);
  h+=`<div class="card"><h3>Succession</h3><p class="sub">Hand the house to an adult son or daughter. The old head retires and stays home.</p><button class="btn ghost" data-act="retire" ${heirs.length?'':'disabled'}>Retire and choose an heir</button></div>`;
  if(!H)h+=`<p class="sub">Buy a house in the Town tab to marry and have children.</p>`;
  return h;}
function pRealm(){let h=`<div><h2>Realms and firms</h2><div class="sub">Licences open markets. Commissions at each capital build influence, which unlocks royal favours.</div></div>`;
  const firms=Object.entries(S.firms);const fam=S.family.members.filter(m=>m.alive&&ageY(m)>=16&&!m.retired&&m.id!==S.family.head);
  if(firms.length){h+=`<div><h3>Firms</h3>`+firms.map(([cid,f])=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(C[cid].name)}</b><span class="chip">Level ${f.lvl}</span></div><div class="sub">Share ${(f.share*100).toFixed(0)}% · last month ${fmt(f.last||0)}</div><div class="row"><select class="qty" style="width:auto" aria-label="Manager"><option value="">No family manager</option>${fam.map(m=>`<option value="${m.id}" ${f.manager===m.id?'selected':''}>${esc(m.name)} (Acumen ${Math.floor(stat(m,'acu'))})</option>`).join('')}</select><button class="btn sm" data-act="mgr" data-x="${cid}">Set manager</button></div></div>`).join('')+`</div>`;}
  h+=`<div><h3>Kingdoms</h3><table><tr><th>Realm</th><th class="num">Entry</th><th class="num">Influence</th><th></th></tr>`;
  DATA.kingdoms.filter(k=>!k.free).forEach(k=>{const lic=S.licenses[k.id];const m=S.missions[k.id];h+=`<tr><td><div class="gname"><span><span style="color:${k.color}">●</span> ${esc(k.name)}</span><small>${esc(k.ruler||'')}${m?` · wants ${m.q} ${G[m.g].name}`:''}</small></div></td><td class="num">${lic?'<span class="chip green">Licensed</span>':`<span class="chip ${S.rep>=k.entry.rep?'':'red'}">rep ${k.entry.rep}</span>`}</td><td class="num">${S.influence[k.id]||0}</td><td class="num"><button class="btn ghost sm" data-act="sel" data-x="${CAPITAL[k.id]}">Court</button></td></tr>`;});
  return h+`</table></div>`;}
function pJournal(){return `<div><h2>Journal</h2><div class="sub">Profit so far ${fmt(S.stats.profit)} · ${S.stats.trades} trades</div></div><div class="log">${S.log.map(l=>`<div class="${l.c}"><span class="sub">${dateStr(l.d)}</span> — ${l.t}</div>`).join('')}</div>`;}

// ---------- Help & save dialogs ----------
$('#b-help').onclick=()=>modal('How to play',`<p>You are a young merchant in Vijayanagara in 1520. Grow a trading house that lasts for generations.</p><ul>
<li><b>Trade.</b> Buy where goods are made (green prices), carry them far, sell where they are dear. Each city sells its own produce; great ports also resell imports.</li>
<li><b>First steps.</b> At the start you can only trade inside the Vijayanagara Empire. Earn a little reputation there (profit raises it), then buy licences for Malabar, the Deccan sultanates and beyond.</li>
<li><b>Compare.</b> Tap <b>%</b> beside any good to see what it fetches in every city you know, then tap a city to plan the trip.</li><li><b>Goals.</b> The strip on the map shows your next goal and what your next title needs. Each year ends with a ledger and three new goals.</li><li><b>Travel.</b> Tap a city on the map, then Set out. Roads are slow; sea passages are fast but stormy in the June–August monsoon.</li>
<li><b>Caravan.</b> Hire deputies, a guard, navigator, accountant, cook and craftsman. Each city's hiring hall is known for certain trades.</li>
<li><b>Kingdoms.</b> Every realm needs a licence and a minimum reputation. Without one, a broker sells your cargo for a 15% cut. Accept a court's commission only if you can deliver it in time. Fulfil the ruler's commissions at the capital to win influence: protection, a monopoly petition, royal gifts and honours.</li>
<li><b>Firms.</b> Open a firm in any licensed city for monthly income that grows with market share.</li>
<li><b>Family.</b> Buy a house, marry (better matches need reputation), raise children. They are schooled in your home city and inherit both parents' abilities. Hand the house to your best heir.</li></ul>`,[{t:'Got it',f:()=>null}]);
$('#b-save').onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal('Save or load',`<p class="sub">The game saves itself in this browser every month. To move it to another device, copy this code and paste it there.</p><textarea id="savecode" aria-label="Save code">${code}</textarea>`,[
  {t:'Copy save code',f:()=>{try{navigator.clipboard.writeText(code).then(()=>toast('Copied'),()=>toast('Select the text and copy it.'));}catch(e){toast('Select the text and copy it.');}return ()=>{};}},
  {t:'Load the code in the box',f:()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob($('#savecode').value.trim()))));if(s&&s.v===1){S=s;autosave();toast('Loaded');}}catch(e){toast('That code did not work.');}return null;}},
  {t:'Start a new house',f:()=>{try{localStorage.removeItem('srt-save');}catch(e){}location.reload();return null;}},
  {t:'Close',f:()=>null}]);};

function cityArt(c){const k=K[c.k];const roof=k.color;const st=c.tier<=1?'hut':KSTYLE[c.k]||'hut';const s=[0,.62,.78,.92,1.08,1.25][c.tier];

// ---------- realm graph ----------
const RADJ={},RSEA={};DATA.kingdoms.forEach(k=>{RADJ[k.id]=new Set();RSEA[k.id]=new Set();});

const UNLOCK_ST=[0,30,60,90,120,150,190,230,270,320,370,420,480,540,600,660];
const UNLOCK_FEE=[0,300,800,1500,2500,4000,6000,8500,11000,14000,18000,23000,29000,36000,45000,55000];
function seaOK(){return !!S&&titleIdx()>=SEA_RANK;}
function owned(k){if(!S||!K[k])return false;return K[k].free?!!(S.vis&&S.vis[k]):!!S.licenses[k];}
function pathR(a,b){const P=DATA.paths;const e=P[a+'|'+b]||P[b+'|'+a];return (e&&e.r)||[];}

function realmNbrs(k){const s=new Set();DATA.edges.forEach(([a,b,m])=>{let o=null;if(C[a].k===k)o=b;else if(C[b].k===k)o=a;else return;const ko=C[o].k;if(ko===k)return;
    if(m==='sea'){if(seaOK())s.add(ko);return;}if(pathR(a,b).every(r=>r===k||r===ko||owned(r)))s.add(ko);});return [...s];}

function enterable(k){return owned(k)||(!!K[k]&&K[k].free&&frontier(k));}
