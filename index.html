const CL_TAGS={
  game_start:()=>clarity('set','started','yes'),
  trade_sell:p=>{clarity('set','sold','yes');if(p.profit<0)clarity('set','sold_at_loss','yes');},
  trade_buy:()=>clarity('set','bought','yes'),
  travel_start:p=>{clarity('set','travelled','yes');if(p.sea)clarity('set','sailed','yes');},
  kingdom_unlock:p=>clarity('set','unlocked',p.kingdom),
  kingdom_unlock_blocked:p=>clarity('set','unlock_blocked',p.kingdom),
  goal_done:p=>clarity('set','last_goal',p.goal),
  year_end:p=>clarity('set','years_done',String(p.year_done-1519)),
  panel_open:p=>clarity('set','last_panel',p.tab),
  js_error:p=>clarity('set','js_error',String(p.msg).slice(0,200)),
  feedback:p=>{clarity('set','fb_rating',String(p.rating||0));clarity('set','fb_from',p.from||'');
    if(p.confusing)clarity('set','fb_confusing',p.confusing.slice(0,250));if(p.keep_playing)clarity('set','fb_keep_playing',p.keep_playing.slice(0,250));if(p.email)clarity('set','fb_email',p.email.slice(0,120));},
  feedback_skip:()=>clarity('set','fb_skipped','yes'),
};
ttLoad();
window.addEventListener('error',e=>track('js_error',{msg:String(e.message).slice(0,200),src:String(e.filename||'').split('/').pop(),line:e.lineno}));
window.addEventListener('unhandledrejection',e=>track('js_error',{msg:String(e.reason).slice(0,200)}));

// ---------- what players do ----------
const _ngT=newGame;newGame=function(n){_ngT(n);S.ttRun=(S.ttRun||0)+1;track('game_start',{name_len:(n||'').length});};
const _buyT=doBuy;doBuy=function(g,n){const b=S.cargo[g]?S.cargo[g].q:0,c0=S.coins;_buyT(g,n);const a=S.cargo[g]?S.cargo[g].q:0;
  if(a>b)track('trade_buy',{good:g,cls:G[g].cls,city:S.loc,qty:a-b,spent:Math.round(c0-S.coins),max:n>=9999});else track('trade_buy_blocked',{good:g,city:S.loc});};
const _sellT=doSell;doSell=function(g,n){const cg=S.cargo[g];const b=cg?cg.q:0,cost=cg?cg.cost:0,c0=S.coins;_sellT(g,n);const a=S.cargo[g]?S.cargo[g].q:0;
  if(b>a){const got=S.coins-c0;track('trade_sell',{good:g,cls:G[g].cls,city:S.loc,qty:b-a,earned:Math.round(got),profit:Math.round(got-cost*(b-a)),broker:!canTrade(S.loc)});}};
const _goT=startTravel;startTravel=function(dst){const was=!!S.travel;_goT(dst);if(!was&&S.travel)track('travel_start',{from:S.loc,to:dst,days:Math.ceil(S.travel.legs.reduce((a,l)=>a+l.days,0)),sea:S.travel.legs.some(l=>l.mode==='sea'),cargo:Math.round(cargoUsed())});
  else if(!S.travel)track('travel_blocked',{from:S.loc,to:dst});};
const _arrT=arrive;arrive=function(){const d=S.travel&&S.travel.dst;const first=d&&!(S.visited||[]).includes(d);_arrT();if(d)track('arrive',{city:d,realm:C[d].k,first_visit:first});};
const _licT=buyLicence;buyLicence=function(k){const had=owned(k);_licT(k);if(!had&&owned(k))track('kingdom_unlock',{kingdom:k,nth:licCount()});else if(!had)track('kingdom_unlock_blocked',{kingdom:k,standing:vouch(k).s,need:unlockReq().st,fee:unlockReq().fee});};
const _ctT=checkTitle;checkTitle=function(){const b=S.titleSeen;_ctT();if(b!==undefined&&S.titleSeen>b)track('title_up',{title:title(),idx:S.titleSeen});};
const _cgT=checkGoals;checkGoals=function(){const b=(S.goalsDone||[]).length;_cgT();(S.goalsDone||[]).slice(b).forEach(id=>track('goal_done',{goal:id,nth:S.goalsDone.indexOf(id)+1}));};
const _ofT=openFirm;openFirm=function(){const h=!!S.firms[S.loc];_ofT();if(!h&&S.firms[S.loc])track('firm_open',{city:S.loc});};
const _yrT=yearly;yearly=function(){track('year_end',{year_done:dateOf(S.day).y-1,profit_total:Math.round(S.stats.profit),trades:S.stats.trades});_yrT();};
const _goverT=gameOver;gameOver=function(){track('game_over',{});_goverT();};
// every button press, by name (Buy, Set out, Unlock, Court, Rest…)
Object.keys(ACT).forEach(k=>{const f=ACT[k];ACT[k]=function(x,y,b){if(!['buy','buymax','sell','sellall','go','licence'].includes(k))track('action',{act:k,x:x||null});return f.apply(this,arguments);};});
// which panels people open, and how long a session lasts
let ttTab='';const _rdT=renderDock;renderDock=function(){_rdT();if(S&&panelOpen&&S.tab!==ttTab){ttTab=S.tab;track('panel_open',{tab:S.tab});}if(!panelOpen)ttTab='';addFeedbackButton();};
let ttHidden=false;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!ttHidden){ttHidden=true;track('session_pause',{});}else if(document.visibilityState==='visible')ttHidden=false;});
setInterval(()=>{if(S&&document.visibilityState==='visible')track('heartbeat',{});},120000);

// ---------- feedback ----------
const FB_ICON='<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
function addFeedbackButton(){const d=$('#dock');if(!d||d.querySelector('.dockb.fb'))return;const b=document.createElement('button');b.className='dockb fb';b.setAttribute('aria-label','Send feedback');
  b.innerHTML=`<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">${FB_ICON}</svg><span>Feedback</span>`;b.onclick=()=>openFeedback('button');d.appendChild(b);}
function openFeedback(from){track('feedback_open',{from});
  const html=`<p class="sub">${from==='year1'?'You have traded through your first year. ':''}Two minutes of your thoughts will shape the next version.</p>
  <div class="fb-stars" role="radiogroup" aria-label="How much are you enjoying it?">${[1,2,3,4,5].map(i=>`<button type="button" class="fbstar" data-v="${i}" aria-label="${i} of 5" onclick="this.parentNode.dataset.v=${i};[...this.parentNode.children].forEach((c,j)=>c.classList.toggle('on',j<${i}))">★</button>`).join('')}</div>
  <label class="fbl">What confused or annoyed you?<textarea id="fb1" rows="3" maxlength="1500"></textarea></label>
  <label class="fbl">What would make you play another year?<textarea id="fb2" rows="3" maxlength="1500"></textarea></label>
  <label class="fbl">Email, if we may follow up (optional)<input id="fb3" type="email" maxlength="120" autocomplete="email"></label>`;
  modal(from==='year1'?'How was your first year?':'Send feedback',html,[
    {t:'Send',f:()=>{const st=document.querySelector('.fb-stars');const r={rating:+(st&&st.dataset.v||0),confusing:($('#fb1')||{}).value||'',keep_playing:($('#fb2')||{}).value||'',email:($('#fb3')||{}).value||'',from};
      if(!r.rating&&!r.confusing.trim()&&!r.keep_playing.trim())return null;
      track('feedback',r);try{if(TT_ON&&window.posthog&&r.email)posthog.setPersonProperties&&posthog.setPersonProperties({email:r.email});}catch(e){}
      if(S){S.fbSent=(S.fbSent||0)+1;autosave();}toast('Thank you. Every note is read.');return null;}},
    {t:'Not now',f:()=>{track('feedback_skip',{from});return null;}}]);}
// ask once, after the review of the first year
const _yrFB=yearly;yearly=function(){_yrFB();if(window.__TEST__||!S||S.fbAsked)return;if(dateOf(S.day).y===1521){S.fbAsked=1;openFeedback('year1');}};
// a plain notice on the title screen
const _tsT=titleScreen;titleScreen=function(saved){_tsT(saved);track('title_screen',{has_save:!!saved});const c=document.querySelector('.title-card');if(c&&!c.querySelector('.ttnote')){const p=document.createElement('p');p.className='ttnote';p.textContent='We record anonymous gameplay to make the game better.';c.appendChild(p);}};

// ---------- phone: bottom sheet that opens, closes and leaves the map clear ----------
const isPhone=()=>window.innerWidth<=900;
function syncSheet(){if(!isPhone())return;const a=document.querySelector('aside');const t=$('#tabs');if(!a||!t)return;const th=t.offsetHeight||52;
  document.documentElement.style.setProperty('--tabsH',th+'px');document.documentElement.style.setProperty('--sheet',(panelOpen?a.offsetHeight:th)+'px');}
const _renderM=render;render=function(){_renderM();if(!S)return;if(isPhone()){$('#tabs').querySelectorAll('button').forEach(b=>{b.setAttribute('aria-selected',String(panelOpen&&S.tab===b.dataset.tab));
  b.onclick=()=>{const t=b.dataset.tab;if(panelOpen&&S.tab===t)panelOpen=false;else{panelOpen=true;S.tab=t;}render();};});}syncSheet();};
addEventListener('resize',()=>{syncSheet();});

$("#pclose").onclick=()=>setPanel(false);$("#ic-coin").innerHTML=UI.coin;$("#ic-star").innerHTML=UI.star;$("#ic-box").innerHTML=UI.box;$("#ic-zzz").innerHTML=UI.zzz;
// ---------- Boot ----------
const hot=window.claude&&window.claude.hot;
function titleScreenOld(saved){const ov=document.createElement('div');ov.className='title-screen';ov.innerHTML=`<div class="title-card"><div class="sub" style="letter-spacing:.2em;text-transform:uppercase">The Indian Ocean · 1520</div><h1>Southeast Asian Trade Tycoon</h1><p>Krishnadevaraya rules from the City of Victory. Horses come in from Hormuz, pepper goes out from Calicut, and the Portuguese have just taken Goa. Start with 300 gold varaha and a pack ox. Build a trading house that outlasts you.</p>
  <div class="row"><label for="pname" class="sub">Your name</label><input id="pname" value="Mallappa" maxlength="24"></div><div class="row"><button class="btn" id="startb">Begin in Vijayanagara</button>${saved?`<button class="btn ghost" id="contb">Continue ${esc(saved.house)} (${dateStr(saved.day)})</button>`:''}</div>
  <p class="sub">An early prototype: 80 cities, 37 realms, 67 goods. History simplified for play.</p></div>`;document.body.appendChild(ov);
  $('#startb').onclick=()=>{newGame($('#pname').value.trim()||'Mallappa');ov.remove();boot();};if(saved)$('#contb').onclick=()=>{S=saved;S.travel&&(S.travel=S.travel);ov.remove();boot();};}
function boot(){buildMap();fitInitial();render();if(S.travel)tickTravel();if(hot&&hot.snapshot)hot.snapshot(()=>S);}
function start(data){if(data&&data.v===1){S=data;boot();return;}titleScreen(loadSave());}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
window.addEventListener('resize',()=>{if(S){const b=$('#mapwrap').getBoundingClientRect();VB.h=VB.w/(b.width/b.height||1);setVB();}});
</script>
</body>
</html>
